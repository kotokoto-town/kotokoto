<!doctype html><html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="ことこと商店街">
<meta name="theme-color" content="#1b1d38"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-180.png">
</head><body><title>ことこと商店街</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen pixel town canvas; HUD chips across the top, tool dock down the left, a JRPG-style window sheet slides in from the right (bottom sheet in portrait). Single retro look by design. */
:root{
  --night:#1b1d38;      /* frame + outer border */
  --win:#262a55;        /* window fill */
  --win2:#323a72;       /* rows inside windows */
  --line:#f4ecd4;       /* inner window border, light text */
  --dim:#b8b6da;        /* secondary text */
  --coin:#ffd24a;       /* money, rewards */
  --leaf:#5fd27a;       /* positive / go */
  --rose:#ff7fa6;       /* highlight */
  --warn:#ff6b5e;       /* sold out / danger */
  --f-pix:"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
/* HUDは お金・ひにち・レベル だけ */
#hFev,#hBgm,#hSpd,#hPause,#guide,#vWx,#vTime,#vEv,#rot{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--night)}
body{color:var(--line);font-family:var(--f-body);font-size:16px;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
#app{position:fixed;inset:0;overflow:hidden;background:var(--night)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:3px solid var(--coin);outline-offset:2px}
.win{background:linear-gradient(180deg,#363f86 0%,#282d5c 55%,#22264c 100%);border:3px solid var(--line);box-shadow:0 0 0 3px var(--night),0 6px 0 3px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.14);border-radius:8px;color:var(--line)}
.pix{font-family:var(--f-pix)}
.ic{width:40px;height:40px;image-rendering:pixelated;flex:none}
.ic.sm{width:30px;height:30px}
/* HUD */
#hud{position:absolute;top:0;left:0;right:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) calc(env(safe-area-inset-right,0px) + 10px) 0 calc(env(safe-area-inset-left,0px) + 10px);pointer-events:none}
#hud>*{pointer-events:auto}
.chip{min-height:50px;padding:4px 14px;font-family:var(--f-pix);font-size:21px;display:inline-flex;align-items:center;gap:8px;box-sizing:border-box;font-variant-numeric:tabular-nums}
.chip small{font-size:15px;color:var(--dim)}
#vMoney{color:var(--coin);min-width:5ch;text-align:right}
#hMoney{border-color:var(--coin)}
#hMoney.bump{animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.12)}}
#hFev{gap:6px}
#hFev .bar{width:80px;height:12px}
#hFev .bar>i{background:linear-gradient(90deg,#ff7fa6,#ffd24a)}
#hFev.fever{border-color:var(--coin);animation:fev 0.5s steps(2) infinite}
@keyframes fev{50%{border-color:var(--rose);color:var(--coin)}}
#vWx{width:26px;height:26px;image-rendering:pixelated}
#banner{position:absolute;z-index:35;left:50%;top:32%;transform:translate(-50%,-50%);pointer-events:none;text-align:center;font-family:var(--f-pix);white-space:nowrap}
#banner .b1{display:inline-block;font-size:clamp(34px,6vw,58px);color:#fff;padding:8px 34px;background:var(--bc,#ff6f9c);border:4px solid var(--line);box-shadow:0 0 0 4px var(--night),0 8px 0 4px rgba(0,0,0,.3);border-radius:10px;text-shadow:3px 3px 0 var(--night)}
#banner .b2{display:block;margin-top:10px;font-size:clamp(18px,2.6vw,26px);color:var(--coin);text-shadow:2px 2px 0 var(--night),-2px -2px 0 var(--night),2px -2px 0 var(--night),-2px 2px 0 var(--night)}
#banner.show{animation:bin 2.4s ease-out forwards}
@keyframes bin{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.12)}20%{transform:translate(-50%,-50%) scale(1)}82%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(.96)}}
#tMascot{width:96px;height:96px;image-rendering:pixelated;animation:hop 1.2s ease-in-out infinite}
@keyframes hop{50%{transform:translateY(-8px)}}
#tLogo{animation:glow 2.4s ease-in-out infinite}
@keyframes glow{50%{text-shadow:4px 4px 0 var(--night),-2px -2px 0 #c0392b,0 0 18px rgba(255,210,74,.7)}}
.bar{display:inline-block;width:70px;height:10px;background:var(--night);border:2px solid var(--line);border-radius:3px;overflow:hidden;vertical-align:middle}
.bar>i{display:block;height:100%;width:0;background:var(--leaf)}
.sp{flex:1}
#vEv{color:var(--rose)}
/* dock */
#dock{position:absolute;z-index:5;left:calc(env(safe-area-inset-left,0px) + 10px);top:calc(env(safe-area-inset-top,0px) + 74px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px;overflow-y:auto;padding:4px}
.dk{width:86px;min-height:62px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-family:var(--f-pix);font-size:14px;padding:4px 0;position:relative;white-space:nowrap}
.dk img{width:34px;height:34px;image-rendering:pixelated;background:var(--c,#555);border-radius:9px;padding:3px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.35)}
.dk:active img{transform:scale(.9)}
.dk .dot{position:absolute;top:4px;right:6px;width:12px;height:12px;border-radius:50%;background:var(--rose);border:2px solid var(--line)}
#guide{position:absolute;z-index:4;left:calc(env(safe-area-inset-left,0px) + 112px);top:calc(env(safe-area-inset-top,0px) + 74px);max-width:min(380px,46vw);text-align:left;padding:8px 12px;font-size:15px;line-height:1.45}
#guide b{font-family:var(--f-pix);color:var(--coin);font-weight:400;font-size:14px;display:block}
#zoom{position:absolute;z-index:4;right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px}
#zoom button{width:56px;height:56px;font-family:var(--f-pix);font-size:26px}
/* build bar */
#buildbar{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:10px;align-items:center;padding:8px 12px;max-width:calc(100vw - 220px);flex-wrap:wrap;justify-content:center}
#bbInfo{font-size:16px;line-height:1.3;min-width:0}
#bbInfo .why{color:var(--warn)}
/* buttons */
.btn{min-height:50px;min-width:66px;padding:6px 14px;border:3px solid var(--line);background:linear-gradient(180deg,#5662c8,#3c4596);border-radius:6px;font-family:var(--f-pix);font-size:18px;line-height:1.15;box-shadow:0 4px 0 var(--night);color:var(--line)}
.btn small{display:block;font-size:13px;opacity:.9}
.btn.go{background:linear-gradient(180deg,#45c46c,#25864a)}
.btn.gold{background:linear-gradient(180deg,#e0a62a,#9c6f12)}
.btn.bad{background:linear-gradient(180deg,#e05a5a,#a33434)}
.btn.ghost{background:transparent}
.btn.on{background:linear-gradient(180deg,#ffa6c4,#ff6f9c);color:var(--night)}
.btn{box-shadow:0 4px 0 var(--night),inset 0 2px 0 rgba(255,255,255,.25)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--night)}
.btn:disabled,.btn.poor{opacity:.42}
/* sheet */
#sheet{position:absolute;z-index:8;top:calc(env(safe-area-inset-top,0px) + 70px);right:0;bottom:0;width:min(500px,52vw);display:flex;flex-direction:column;transform:translateX(110%);transition:transform .2s ease-out;border-radius:8px 0 0 0;border-right:none;padding:6px env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0;box-sizing:border-box}
#sheet.open{transform:none}
#shHead{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;margin:-6px 0 8px;border-radius:6px 0 0 0;background:var(--hc,linear-gradient(90deg,#4a56b8,#323a72))}
#shTitle{text-shadow:2px 2px 0 var(--night)}
#shTitle{flex:1;margin:0;font-family:var(--f-pix);font-weight:400;font-size:26px;text-wrap:balance}
#shClose{min-width:96px}
#shTabs{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 8px}
#shTabs .btn{flex:1 1 auto;min-width:0;font-size:17px}
#shBody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 14px 30px;touch-action:pan-y;display:flex;flex-direction:column;gap:10px}
.sec{font-family:var(--f-pix);font-size:18px;color:var(--coin);margin:8px 0 0}
.note{color:var(--dim);font-size:14px;line-height:1.55;margin:0}
.row{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--win2);border-radius:6px;min-width:0}
.row .grow{flex:1;min-width:0}
.row .nm{font-family:var(--f-pix);font-size:18px;line-height:1.2}
.row .sub{font-size:13px;color:var(--dim);line-height:1.4;font-variant-numeric:tabular-nums}
.stk{font-family:var(--f-pix);font-size:20px;min-width:3ch;text-align:center;font-variant-numeric:tabular-nums}
.stk.zero{color:var(--warn)}
.pm{min-width:76px;font-size:15px;padding:4px 6px}
.lock{opacity:.55}
.slots{display:flex;gap:8px;flex-wrap:wrap}
.slot{flex:1 1 120px;min-width:0;background:var(--night);border:2px dashed var(--dim);border-radius:6px;padding:6px 8px;display:flex;align-items:center;gap:8px;min-height:44px;font-size:14px}
.slot.busy{border-style:solid;border-color:var(--leaf)}
.pg{height:8px;background:#11132a;border-radius:3px;overflow:hidden;margin-top:3px}
.pg>i{display:block;height:100%;width:0;background:var(--leaf)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:8px}
.card{background:var(--win2);border:3px solid transparent;border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0;color:var(--line)}
.card img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated}
.card .nm{font-family:var(--f-pix);font-size:16px;line-height:1.2}
.card .sub{font-size:12.5px;color:var(--dim);line-height:1.35}
.card .pr{font-family:var(--f-pix);color:var(--coin);font-size:16px}
.card.poor .pr{color:var(--warn)}
.card.lock{opacity:.5}
.pips{letter-spacing:2px;color:var(--coin);font-family:var(--f-pix)}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.mat{min-height:70px;background:var(--win2);border:3px solid transparent;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13.5px;gap:2px;padding:4px}
.mat.sel{border-color:var(--coin);background:#4a4a20}
.pair{display:flex;align-items:center;gap:10px;justify-content:center;font-family:var(--f-pix);font-size:22px}
.pair .box{width:72px;height:72px;border:3px dashed var(--dim);border-radius:8px;display:flex;align-items:center;justify-content:center}
.ok{color:var(--leaf)} .ng{color:var(--warn)} .gold{color:var(--coin)}
textarea{width:100%;box-sizing:border-box;min-height:110px;background:var(--night);color:var(--line);border:2px solid var(--dim);border-radius:6px;font-size:12px;padding:8px;-webkit-user-select:text;user-select:text}
/* toasts */
#toasts{position:absolute;z-index:20;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,80vw)}
.toast{padding:8px 16px;font-size:16px;font-family:var(--f-pix);text-align:center;animation:tin .2s ease-out}
.toast.good{border-color:var(--leaf)} .toast.bad{border-color:var(--warn)} .toast.gold{border-color:var(--coin)}
@keyframes tin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
/* dialog */
#drawWrap{position:absolute;inset:0;z-index:40;background:var(--night);display:flex;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 10px) calc(env(safe-area-inset-right,0px) + 10px) calc(env(safe-area-inset-bottom,0px) + 10px) calc(env(safe-area-inset-left,0px) + 10px);box-sizing:border-box}
#drArea{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:#141530;border:3px solid var(--line);border-radius:8px;overflow:hidden}
#drCv{touch-action:none;image-rendering:pixelated;display:block}
#drSide{width:340px;flex:none;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px;padding:0 4px 8px 0}
#drSide .row2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drSw{width:36px;height:36px;border-radius:6px;border:3px solid var(--night);padding:0;flex:none}
.drSw.on{border-color:var(--coin);box-shadow:0 0 0 2px var(--night)}
.drRange{width:100%;height:34px;margin:0;-webkit-appearance:none;appearance:none;border-radius:17px;border:2px solid var(--line);touch-action:pan-y}
.drRange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--night)}
.drRange::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--night)}
#drCur{width:64px;height:64px;border-radius:10px;border:3px solid var(--line);flex:none}
@media (orientation:portrait){#drawWrap{flex-direction:column}#drSide{width:auto;height:46%}}
#dlgWrap{position:absolute;inset:0;z-index:45;background:rgba(10,10,30,.55);display:flex;align-items:center;justify-content:center;padding:16px}
#dlg{width:min(560px,100%);max-height:calc(100% - 32px);overflow-y:auto;padding:18px 20px;box-sizing:border-box}
#dlg h3{margin:0 0 10px;font-family:var(--f-pix);font-weight:400;font-size:26px;color:var(--coin);text-wrap:balance}
#dlg .db{font-size:16px;line-height:1.65}
#dlg .dbtn{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.tbl td{padding:4px 2px;border-bottom:1px solid var(--win2)}
.tbl td:last-child{text-align:right;font-family:var(--f-pix);font-size:18px}
.big-ic{display:block;margin:6px auto;width:96px;height:96px;image-rendering:pixelated}
/* title */
#title{position:absolute;inset:0;z-index:25;display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(rgba(20,20,50,.35),rgba(20,20,50,.65))}
#tBox{width:min(620px,100%);padding:22px 24px;text-align:center;max-height:calc(100% - 20px);overflow-y:auto;box-sizing:border-box}
#tLogo{font-family:var(--f-pix);font-size:clamp(40px,7vw,64px);margin:4px 0 2px;color:var(--coin);text-shadow:4px 4px 0 var(--night),-2px -2px 0 #c0392b;letter-spacing:.04em}
#tSub{margin:0 0 14px;color:var(--line);font-size:17px}
#tSave{background:var(--win2);border-radius:8px;padding:10px 12px;margin:0 0 14px;font-size:15px;line-height:1.6;text-align:left}
#tBtns{display:flex;flex-direction:column;gap:10px;align-items:stretch}
#tBtns .btn{font-size:22px;min-height:60px}
#tMsg{margin-top:10px;font-size:14px;color:var(--dim)}
#err{position:absolute;z-index:40;left:0;right:0;bottom:0;background:#a83a3a;color:#fff;padding:10px calc(env(safe-area-inset-right,0px) + 14px) calc(env(safe-area-inset-bottom,0px) + 10px) 14px;font-size:14px}
#rot{position:absolute;z-index:3;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 128px);padding:6px 12px;font-size:14px;display:none}
@media (orientation:portrait){
  #rot{display:block}
  #dock{top:auto;left:0;right:0;bottom:0;flex-direction:row;flex-wrap:wrap;justify-content:center;overflow:visible;gap:6px;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 8px)}
  .dk{width:64px;min-height:54px;font-size:12px}
  #guide{left:10px;top:calc(env(safe-area-inset-top,0px) + 132px);max-width:calc(100vw - 20px)}
  #rot{top:calc(env(safe-area-inset-top,0px) + 190px)}
  #zoom{bottom:calc(env(safe-area-inset-bottom,0px) + 168px)}
  #buildbar{bottom:calc(env(safe-area-inset-bottom,0px) + 146px);max-width:calc(100vw - 20px)}
  #sheet{top:auto;left:0;width:auto;height:60%;border-radius:8px 8px 0 0;border-right:3px solid var(--line);border-bottom:none;transform:translateY(110%);padding-right:0}
}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}.toast,#banner.show,#tMascot,#tLogo,#hFev.fever{animation:none}#banner.show{opacity:1}}
</style>

<div id="app">
  <canvas id="cv" aria-label="町のマップ"></canvas>
  <div id="hud">
    <button class="chip win" id="hMoney" aria-label="おかね"><img id="coinIc" class="ic sm" alt=""><span id="vMoney">0</span></button>
    <button class="chip win" id="hLv" aria-label="レベル">Lv<span id="vLv">1</span><span class="bar"><i id="vExp"></i></span></button>
    <button class="chip win" id="hDay"><img id="vWx" alt=""><span id="vDay">1にちめ</span><small id="vTime">あさ</small><small id="vEv">はれ</small></button>
    <button class="chip win" id="hFev" aria-label="にぎわいゲージ"><img id="fevIc" class="ic sm" alt=""><span class="bar"><i id="vFev"></i></span></button>
    <div class="sp"></div>
    <button class="chip win" id="hBgm" aria-label="おんがく">♪</button>
    <button class="chip win" id="hSpd" aria-label="はやさ">×1</button>
    <button class="chip win" id="hPause">とめる</button>
  </div>
  <nav id="dock" aria-label="メニュー"></nav>
  <button id="guide" class="win" hidden></button>
  <div id="rot" class="win">よこむきに すると あそびやすいよ</div>
  <div id="zoom"><button class="win" data-z="1" aria-label="ズームイン">＋</button><button class="win" data-z="-1" aria-label="ズームアウト">－</button><button class="win" data-z="0" aria-label="まんなかへ">◎</button></div>
  <div id="buildbar" class="win" hidden><div id="bbInfo"></div><button class="btn go" id="bbOk">ここに たてる</button><button class="btn" id="bbNo">やめる</button></div>
  <aside id="sheet" class="win" aria-hidden="true">
    <div id="shHead"><h2 id="shTitle"></h2><button class="btn" id="shClose">とじる</button></div>
    <div id="shTabs"></div>
    <div id="shBody"></div>
  </aside>
  <div id="toasts" aria-live="polite"></div>
  <div id="banner" aria-live="polite"></div>
  <div id="dlgWrap" hidden><div id="dlg" class="win" role="dialog"></div></div>
  <div id="title">
    <div id="tBox" class="win">
      <img id="tMascot" alt="">
      <h1 id="tLogo">ことこと商店街</h1>
      <p id="tSub">ちいさな パンやさんから、じぶんだけの まちへ</p>
      <div id="tSave">セーブデータを しらべています…</div>
      <div id="tBtns"></div>
      <div id="tMsg"></div>
      
    </div>
  </div>
  <div id="err" hidden></div>
  <input type="file" id="tFile" accept=".json,application/json,text/plain" style="position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none" tabindex="-1" aria-hidden="true">
</div>

<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)};
var errBox=$('#err');
function showErr(e){try{errBox.hidden=false;errBox.textContent='エラーが おきました：'+((e&&e.message)||e)+' ／ データは じどうセーブ されています。ページを よみこみなおしてね。';}catch(_){}}
window.addEventListener('error',function(ev){showErr(ev.error||ev.message)});

/* ================= constants & data ================= */
var TS=16, MW=60, MH=40, DAYLEN=180;

  var INF=65535,d=new Uint16Array(MW*MH).fill(INF),q=new Int32Array(MW*MH),h=0,t=0;
  srcs.forEach(function(p){var i=p[1]*MW+p[0];if(d[i]!==INF)return;d[i]=0;q[t++]=i});
  while(h<t){var i=q[h++],x=i%MW,y=(i/MW)|0,nd=d[i]+1;
    if(x>0&&d[i-1]===INF&&walkable(x-1,y,oc)){d[i-1]=nd;q[t++]=i-1}

function startJob(s,rid,by){
  var r=RBY[rid];if(!S.known[rid])return 'unknown';if(r.rare&&s.lv<3)return 'rarelv';
  if(s.q.length>=slots(s))return 'full';

  var n=Math.min(batch(s),room),need=matNeed(r),m,auto=S.set.autoBuy;
  for(m in need){var can=auto&&matOK(m)?Math.floor((inv(m)+Math.max(0,invCap()-inv(m)))/need[m]):Math.floor(inv(m)/need[m]);if(can<n)n=can;if(n<=0){LASTLACK=MATBY[m].name;return 'mats'}}

  var coin=coinCost(r)*n;if(S.money<coin+buy)return 'money';
  for(m in need){var short=Math.max(0,need[m]*n-inv(m));if(short)buyMat(m,short);S.inv[m]=inv(m)-need[m]*n}

function doResearch(type,a,b){
  if(!labBuilt())return {msg:'けんきゅうじょが ひつようだよ',bad:1};
  var key=pairKey(a,b),tried=S.tried[type]||(S.tried[type]={});
  var hit=RSHOP[type].filter(function(r){return !r.custom&&pairKey(r.m[0],r.m[1])===key})[0];
  if(hit&&S.known[hit.id])return {msg:hit.name+' は もう しってるよ',bad:1};
  if(!hit&&tried[key])return {msg:'その くみあわせは もう ためしたよ',bad:1};
  var cost=researchCost(type);if(S.money<cost)return {msg:'おかねが たりないよ（'+cost+'）',bad:1};
  S.money-=cost;S.today.cost+=cost;tried[key]=1;
  if(hit){S.known[hit.id]=1;S.stats.disc++;if(hit.rare)S.stats.rareDisc++;gainExp(20+SHOPBY[type].tier*5);delete S.hints[hit.id];sfx('lv');statsDirty=true;
    queueDlg(function(){dlg('はっけん！','<img class="big-ic" src="'+rIcon(hit)+'" alt=""><p style="text-align:center"><b class="gold" style="font-size:22px">'+hit.name+'</b><br>'+SHOPBY[type].name+'で つくれるように なったよ！<br>うりね '+hit.price+'・げんか '+hit.cost+(hit.rare?'<br><span class="gold">★レアしょうひん（おみせLv3から）</span>':'')+'</p>',[{t:'やった！',c:'go'}])});saveSoon();
    return {msg:hit.name+' を はっけん！',good:1}}
  var und=RSHOP[type].filter(function(r){return !S.known[r.id]});
  var close=und.filter(function(r){return r.m.indexOf(a)>=0||r.m.indexOf(b)>=0});
  S.insp++;saveSoon();
  if(close.length){var m=close[0].m.indexOf(a)>=0?a:b;return {msg:'おしい！ '+MATBY[m].name+' は なにかに つかえそう…（ひらめき +1）'}}
  return {msg:'うまく いかなかった…（ひらめき +1）'};
}
function useInsp(type){
  if(S.insp<3)return 'ひらめきが 3つ ひつようだよ';
  var und=RSHOP[type].filter(function(r){return !S.known[r.id]&&(r.m.indexOf('gem')<0||gemOK())&&(S.hints[r.id]||0)<2});
  if(!und.length)return 'この おみせの ヒントは もう ないよ';
  var r=pick(und);S.hints[r.id]=(S.hints[r.id]||0)+1;S.insp-=3;saveSoon();return 'ヒント：「'+r.name+'」には '+MATBY[r.m[S.hints[r.id]-1]].name+' を つかう！';
}

function chooseShop(exclude,from){
  var tot=0,cands=[];S.shops.forEach(function(s){if(s===exclude)return;var f=fieldFor(s);if(f[from]>=65535)return;var w=CACHE.attr[s.id]||1;cands.push([s,w]);tot+=w});
  if(!cands.length)return null;var r=rnd()*tot;for(var i=0;i<cands.length;i++){r-=cands[i][1];if(r<=0)return cands[i][0]}return cands[cands.length-1][0];
}
function spawnCustomer(vip){

  if(homes.length&&rnd()<Math.min(0.6,residents()*0.06)){var h=pick(homes);var d=doorOf(h);start=[d.x,d.y]}else start=pick(EXITS);
  if(!walkable(start[0],start[1]))return;
  var idx=start[1]*MW+start[0];var s=chooseShop(null,idx);if(!s)return;
  var kind=rnd()<0.22?'kid':rnd()<0.15?'elder':'adult';var L=randLook(kind);if(vip){L.vip=1;L.kid=0}
  var kl=knownOf(s.type);var want=kl.length?pick(kl).id:null;
  var c={want:want,bubT:rnd()*6,bal:(kind==='kid'&&rnd()<0.4)?pick(['#ff5f8f','#4fa3ff','#ffd24a','#62d27a','#c08cff']):null,bag:null,x:start[0]*TS+8,y:start[1]*TS+8,tx:start[0],ty:start[1],nx:start[0],ny:start[1],tgt:s.id,goal:'shop',st:'walk',tm:0,look:L,dir:0,an:rnd(),spd:(kind==='kid'?1.12:kind==='elder'?0.8:1)*(26+rnd()*6),ox:ri(-3,3),oy:ri(-2,2),emo:null,visits:0,vip:!!vip};

function stepCustomer(c,dt){
  if(c.emo){c.emo.t-=dt;if(c.emo.t<=0)c.emo=null}
  if(c.st==='in'){c.tm-=dt;if(c.tm<=0){var s=shopBy(c.tgt);if(s)buy(c,s);c.st='walk';c.visits++;
      if(s&&c.visits<3&&rnd()<0.3){var ns=chooseShop(s,c.ty*MW+c.tx);if(ns){c.tgt=ns.id;c.goal='shop'}else c.goal='exit'}else c.goal='exit'}
    return true}
  var tx=c.nx*TS+8,ty=c.ny*TS+8,dx=tx-c.x,dy=ty-c.y,dist=Math.abs(dx)+Math.abs(dy);
  var sp=c.spd*(roadG[c.ty*MW+c.tx]?1.35:1)*dt;
  if(dist>0.01){c.an+=dt*6;if(Math.abs(dx)>Math.abs(dy))c.dir=dx<0?2:3;else c.dir=dy<0?1:0;
    if(dist<=sp){c.x=tx;c.y=ty}else{c.x+=(Math.abs(dx)>0.01?Math.sign(dx):0)*Math.min(sp,Math.abs(dx));c.y+=(Math.abs(dx)<=0.01?Math.sign(dy)*Math.min(sp,Math.abs(dy)):0)}return true}
  c.tx=c.nx;c.ty=c.ny;
  var f;if(c.goal==='shop'){var s2=shopBy(c.tgt);if(!s2){c.goal='exit';f=exitField}else f=fieldFor(s2)}else f=exitField;
  var i=c.ty*MW+c.tx;
  if(f[i]===0){if(c.goal==='exit')return false;c.st='in';var s3=shopBy(c.tgt);c.tm=1.3/(1+(s3?s3.eq.reg*0.3:0));if(s3)s3.visits++;return true}
  if(f[i]>=65535){if(c.goal==='shop'){c.goal='exit';return true}return false}
  var best=f[i],opts=[];[[1,0],[-1,0],[0,1],[0,-1]].forEach(function(o){var nx=c.tx+o[0],ny=c.ty+o[1];if(nx<0||ny<0||nx>=MW||ny>=MH)return;var v=f[ny*MW+nx];if(v<best){best=v;opts=[[nx,ny]]}else if(v===best&&v<f[i])opts.push([nx,ny])});
  if(!opts.length){c.goal='exit';return f!==exitField}
  var o2=pick(opts);c.nx=o2[0];c.ny=o2[1];return true;
}
function buy(c,s){
  var serve=0;S.staff.forEach(function(st){if(st.shop===s.id&&st.role==='serve')serve+=st.sv});
  var combos=(CACHE.combos[s.id]||[]).length,cm=1+0.1*Math.min(2,combos);
  var wants=1+(rnd()<0.35?1:0)+(rnd()<0.12+0.08*s.eq.reg?1:0)+(rnd()<serve*0.03?1:0);if(c.vip)wants=3;
  var got=0,total=0,pricey=false;
  for(var w=0;w<wants;w++){
    var avail=knownOf(s.type).filter(function(r){var a=s.st[r.id];return a&&(a[0]+a[1])>0});
    if(!avail.length)break;
    var r;if(c.vip){avail.sort(function(a,b){return b.price-a.price});r=avail[0]}else{var wr=w===0&&c.want?avail.filter(function(x){return x.id===c.want})[0]:null;r=wr||pick(avail)}
    var pm=pmOf(s,r.id),acc=Math.min(1,accOf(pm)+serve*0.025+combos*0.06);
    if(!c.vip&&rnd()>acc){pricey=true;continue}
    var a=s.st[r.id],star=a[1]>0&&(a[0]===0||rnd()<0.5);if(star)a[1]--;else a[0]--;
    var val=Math.round(r.price*pm*(star?2:1)*cm*(c.vip?3:1)*(S.feverT>0?1.2:1));total+=val;got++;
    S.stats.sold++;S.today.sold++;var pp=S.stats.pp[r.id]||(S.stats.pp[r.id]={m:0,s:0,st:0});pp.s++;
    gainExp(Math.ceil(r.price/16)*(star?2:1));
  }
  if(got){addMoney(total);S.stats.rev+=total;S.today.rev+=total;s.rev+=total;c.emo={k:c.vip?'star':'heart',t:1.4};c.bag=SHOPBY[s.type].aw[0];c.want=null;
    var ct=center(s);pop(ct.x*TS,s.y*TS-6,'+'+fmt(total),'#ffd24a');sfx('coin');coinFly(ct.x*TS,(s.y+1)*TS,Math.min(4,got+1));addFever(got);
    S.staff.forEach(function(st){if(st.shop===s.id&&st.role==='serve')gainStaffExp(st,1)});
    if(c.vip)toast('グルメきしゃが '+fmt(total)+'コイン ぶん かってくれた！ きじに なるかも','gold');statsDirty=true;
  }else{c.emo={k:pricey?'pricey':'drop',t:1.6};if(!pricey){S.stats.miss++;S.today.miss++}}
}

function beginPlace(kind,type){
  var w,h;if(kind==='shop'){w=3;h=3}else{w=OBJ[type].w;h=OBJ[type].h}
  var c=screenToTile(cvW/2/dpr,cvH/2/dpr);
  UI.place={kind:kind,type:type,w:w,h:h,x:clamp(c.x-Math.floor(w/2),0,MW-w),y:clamp(c.y-Math.floor(h/2),0,MH-h),move:0};UI.mode='place';
  closeSheet();showBuildBar();
}
function beginMove(id){var o=byId(id);if(!o)return;var z=sizeOf(o);UI.place={kind:o.type?'shop':'obj',type:o.type||o.k,w:z.w,h:z.h,x:o.x,y:o.y,move:id};UI.mode='place';closeSheet();showBuildBar()}
function cancelPlace(){if(UI.mode){UI.mode=null;UI.place=null;hideBuildBar()}}
function placeCost(p){if(p.move)return 0;return p.kind==='shop'?shopCost(p.type):OBJ[p.type].cost}
function checkPlace(p){
  var oc=new Int32Array(occ);if(p.move){for(var i=0;i<oc.length;i++)if(oc[i]===p.move)oc[i]=0}
  for(var y=p.y;y<p.y+p.h;y++)for(var x=p.x;x<p.x+p.w;x++){
    if(x<0||y<0||x>=MW||y>=MH)return {ok:0,why:'マップの そとだよ'};
    if(!landUnlocked(x,y))return {ok:0,why:'まだ かっていない とちだよ'};
    if(isMainRoad(x,y))return {ok:0,why:'おおどおりには おけないよ'};
    if(oc[y*MW+x])return {ok:0,why:'ほかの ものが あるよ'};
    if(p.type!=='road'&&roadG[y*MW+x])return {ok:0,why:'みちの うえには おけないよ'};
    if(p.type==='road'&&roadG[y*MW+x])return {ok:0,why:'もう みちだよ'};
  }
  if(p.type==='road')return {ok:1};
  var id=p.move||-1;for(var y2=p.y;y2<p.y+p.h;y2++)for(var x2=p.x;x2<p.x+p.w;x2++)oc[y2*MW+x2]=id;
  var hasD=p.kind==='shop'||OBJ[p.type].door;
  if(hasD){var dx=p.x+Math.floor(p.w/2),dy=p.y+p.h;if(!walkable(dx,dy,oc))return {ok:0,why:'いりぐち（したがわ）を あけてね'}}
  var ef=bfs(EXITS,oc);var doors=[];if(hasD)doors.push([p.x+Math.floor(p.w/2),p.y+p.h]);
  allBlds().forEach(function(o){if(o.id===p.move||!hasDoor(o))return;var d=doorOf(o);doors.push([d.x,d.y])});
  for(var k=0;k<doors.length;k++){var d=doors[k];if(!walkable(d[0],d[1],oc)||ef[d[1]*MW+d[0]]>=65535)return {ok:0,why:'みちが ふさがって おきゃくさんが いけなく なるよ'}}
  return {ok:1};
}
function commitPlace(){
  var p=UI.place;if(!p)return;var chk=checkPlace(p);if(!chk.ok){toast(chk.why,'bad');return}
  var cost=placeCost(p);if(S.money<cost){toast(REASON.money,'bad');return}
  if(!p.move&&p.kind==='obj'&&OBJ[p.type].max&&countObj(p.type)>=OBJ[p.type].max){toast('これは '+OBJ[p.type].max+'つまで だよ','bad');cancelPlace();return}
  S.money-=cost;
  if(p.move){var o=byId(p.move);o.x=p.x;o.y=p.y;toast('いどうしたよ','good');cancelPlace()}
  else if(p.kind==='shop'){var s=newShop(p.type,p.x,p.y);S.shops.push(s);learnStarters(p.type);toast(SHOPBY[p.type].name+' が できた！','gold');sfx('lv');cancelPlace();fillReq();afterMapChange();openSheet('shop',s.id)}
  else{S.objs.push({id:S.nid++,k:p.type,x:p.x,y:p.y});sfx('buy');if(p.w===1&&p.h===1){afterMapChange();showBuildBar();saveSoon();return}toast(OBJ[p.type].name+' を おいたよ','good');cancelPlace()}
